{{define "_nav"}}
<nav class="navbar navbar-dark navbar-expand-lg" style="background-color: var(--bs-blue)">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="/img/ggp-logo-full-color.svg" width="125" />
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="/home">Home</a>
        </li>
      </ul>
      <div class="row mb-2 mx-2">
        <div class="col-12 d-flex align-items-center gap-2">
          <button
            type="button"
            class="btn btn-outline-light btn-sm flex-shrink-0"
            data-bs-toggle="modal"
            data-bs-target="#rpcModal"
            title="Configure RPC Endpoint"
            _="on click
               js return localStorage.getItem('ethURL') end
               then put it into #rpcInput.value
            "
          >
            <i class="bi bi-gear-fill"></i>
          </button>

          <select
            id="deployment"
            name="deployment"
            class="form-control form-control form-select flex-grow-1"
            _="on load 
             js return localStorage.getItem('deployment') end
             then put it into my value
             on change 
             call localStorage.setItem('deployment', my value)
             then call window.location.reload()
          "
          >
            <option value="mainnet" selected>Mainnet</option>
            <option value="fuji">Fuji</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- RPC Endpoint Configuration Modal -->
<div class="modal fade" id="rpcModal" tabindex="-1" aria-labelledby="rpcModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="rpcModalLabel"><i class="bi bi-gear-fill me-2"></i>Configure RPC Endpoint</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="rpcInput" class="form-label">RPC Endpoint URL</label>
          <input
            type="url"
            class="form-control"
            id="rpcInput"
            placeholder="https://api.avax.network/ext/bc/C/rpc"
            _="on keydown[key is 'Enter'] call #saveRpcBtn.click()"
          />
          <div class="form-text">
            Enter your custom RPC endpoint URL. Leave empty to use default endpoint (but you will probably get rate
            limited).
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button
          type="button"
          class="btn btn-primary"
          id="saveRpcBtn"
          _="on click
             call localStorage.setItem('ethURL', #rpcInput.value)
             then call bootstrap.Modal.getInstance(#rpcModal).hide()
             then call window.location.reload()
          "
        >
          Save RPC Endpoint
        </button>
      </div>
    </div>
  </div>
</div>
{{end}}
